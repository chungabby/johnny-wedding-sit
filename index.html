<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abby &amp; Johnny 婚宴桌位規劃表</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brown:   #3a5991;
  --blush:   #c79483;
  --mauve:   #a5908b;
  --olive:   #88794e;
  --gold:    #d6b777;
  --linen:   #f2ece0;
  --pinkgrey:#e2d8cf;
  --groom:   #3a5991; --groom-l: #dce5f5; --groom-d: #1e3560;
  --bride:   #c79483; --bride-l: #e2d8cf; --bride-d: #8a5840;
  --main:    #d6b777; --main-l:  #f5ecd8; --main-d:  #7a5a18;
  --veg:     #88794e; --veg-l:   #e8e0d0; --veg-d:   #4a4028;
  --cream:   #fffffd; --page:    #f4f3ef;
  --text:    #2a1f18; --muted:   #9a8878; --hint: #c8bdb0;
  --rule:    #ddd5cc; --rule-md: rgba(0,0,0,0.15);
  --r: 10px; --rl: 14px;
  --font: 'Chiron GoRound TC','Noto Sans TC',sans-serif;
}
body{font-family:var(--font);background:var(--page);color:var(--text);min-height:100vh;}
.deco{position:fixed;pointer-events:none;z-index:0;opacity:0.15;}
.deco-tl{top:-15px;left:-15px;width:180px;transform:rotate(-12deg);}
.deco-tr{top:-15px;right:-15px;width:160px;transform:rotate(15deg) scaleX(-1);}
.deco-bl{bottom:-15px;left:-15px;width:160px;transform:rotate(8deg);}
.deco-br{bottom:-15px;right:-15px;width:180px;transform:rotate(-8deg) scaleX(-1);}

/* Header */
.hdr{background:#fffffd;border-bottom:1px solid var(--rule);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:10;}
.hdr-logo{height:32px;object-fit:contain;}
.hdr-title{font-size:16px;font-weight:700;}
.hdr-title span{color:#E8623A;}
.hdr-sub{font-size:11px;color:var(--muted);}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#syncStatus{font-size:11px;font-weight:600;min-width:58px;text-align:right;}

/* Buttons */
.btn{font-family:var(--font);font-size:13px;padding:6px 14px;border:1px solid var(--rule-md);border-radius:8px;background:var(--cream);color:var(--text);cursor:pointer;height:34px;white-space:nowrap;font-weight:500;transition:background .12s;}
.btn:hover{background:#f0e8d0;}
.btn.pri{background:#3a5991;color:#fff;border-color:#1e3560;}
.btn.pri:hover{background:#1e3560;}
.btn.sec{background:var(--bride-l);color:var(--bride-d);border-color:var(--bride);}
.btn.cloud{background:#378ADD;color:#fff;border-color:#0C447C;}
.btn.cloud:hover{background:#0C447C;}

/* Stats */
.stats{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px 0;position:relative;z-index:10;background:var(--page);}
.sc{background:#fffffd;border:1px solid var(--rule);border-radius:var(--r);padding:9px 14px;flex:1;min-width:80px;text-align:center;}
.sc-l{font-size:12px;color:var(--muted);margin-bottom:3px;}
.sc-v{font-size:22px;font-weight:700;}

/* Legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 20px 0;font-size:13px;color:var(--muted);align-items:center;position:relative;z-index:10;}
.leg{display:flex;align-items:center;gap:5px;}
.ld{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.ld.empty{background:#e8e6e0;border:2px dashed #888;}
.status-legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 20px 0;font-size:13px;color:var(--muted);align-items:center;position:relative;z-index:10;}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--rule);background:#fffffd;padding:0 20px;margin-top:10px;position:relative;z-index:10;}
.tab{font-family:var(--font);font-size:13px;font-weight:500;padding:9px 18px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--brown);border-bottom-color:var(--brown);}
.main{padding:14px 20px 60px;position:relative;z-index:10;}

/* Badges */
.badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;}
.badge.g{background:var(--groom-l);color:var(--groom-d);}
.badge.b{background:var(--bride-l);color:var(--bride-d);}
.badge.v{background:var(--veg-l);color:var(--veg-d);}
.badge.m{background:var(--main-l);color:var(--main-d);}

/* Add toolbar — 座位牌輸入框已移除 */
.add-tbar{background:#fffffd;border:1px dashed var(--brown);border-radius:var(--rl);padding:10px 14px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.add-tbar input,.add-tbar select{font-family:var(--font);font-size:13px;padding:5px 10px;border:1px solid var(--rule-md);border-radius:8px;background:#fff;color:var(--text);height:34px;outline:none;}
.add-tbar input:focus,.add-tbar select:focus{border-color:var(--brown);}
.add-tbar input.tn{width:140px;} .add-tbar input.ts{width:58px;}

/* Empty zone */
.empty-zone{text-align:center;color:var(--hint);font-size:13px;padding:1.2rem;border:1.5px dashed var(--rule-md);border-radius:var(--rl);background:var(--cream);cursor:pointer;transition:background .15s;}
.empty-zone:hover{background:#f5f0e8;color:var(--muted);}

/* Floor view */
.tcard{background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:10px;transition:box-shadow .15s;}
.tcard.main-t{border-color:var(--main);border-width:2px;background:var(--main-l);}
.tcard-top{display:flex;justify-content:space-between;align-items:flex-start;}
.tcard-name{font-size:12px;font-weight:700;}
.tcard-meta{font-size:10px;color:var(--muted);margin:2px 0 4px;}
.del-btn{font-size:18px;line-height:1;color:var(--hint);border:none;background:none;cursor:pointer;padding:1px 3px;border-radius:4px;}
.del-btn:hover{color:#c0392b;background:#fdecea;}
.svg-wrap{display:flex;justify-content:center;margin:2px 0 4px;}
.cake-row{display:flex;align-items:center;gap:5px;padding-top:6px;border-top:1px solid var(--rule);font-size:11px;}
.cake-count{font-weight:700;color:var(--main-d);flex-shrink:0;}
.cake-names{font-size:10px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

#tooltip{position:fixed;background:#1a1a1a;color:#fff;font-size:11px;font-family:var(--font);padding:4px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;z-index:9999;display:none;}

/* List layout */
.list-top-area{margin-bottom:14px;}
.list-cols{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.list-col{padding:0 8px;}
.list-col-hdr{font-size:11px;font-weight:700;letter-spacing:1px;padding:6px 12px;border-radius:8px;margin-bottom:10px;text-align:center;}
.list-col-hdr.g{background:var(--groom-l);color:var(--groom-d);}
.list-col-hdr.b{background:var(--bride-l);color:var(--bride-d);}
.list-col-hdr.m{background:var(--main-l);color:var(--main-d);}
.lpanel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.lpanel{background:#fffffd;border:1px solid var(--rule);border-radius:var(--rl);padding:12px 14px;}
.lpanel.main-t{border-color:var(--main);border-width:2px;}
.lp-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}

/* 桌名 — 可點擊行內編輯 */
.lp-name{font-size:13px;font-weight:700;cursor:pointer;padding:2px 4px;border-radius:4px;transition:background .12s;display:inline-block;}
.lp-name:hover{background:var(--linen);}
.lp-name-input{font-family:var(--font);font-size:13px;font-weight:700;padding:2px 6px;border:1.5px solid var(--brown);border-radius:5px;background:#fff;color:var(--text);outline:none;width:130px;display:inline-block;}

.lp-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.lp-del{font-family:var(--font);font-size:12px;color:var(--hint);border:1px solid var(--rule-md);background:none;cursor:pointer;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.lp-del:hover{color:#c0392b;background:#fdecea;border-color:#f09595;}
.g-rows{border-top:1px solid var(--rule);margin-bottom:8px;}
.g-row{display:flex;align-items:center;gap:5px;padding:5px 0;border-bottom:1px solid var(--rule);}
.g-row:last-child{border-bottom:none;}
.g-name{flex:1;font-size:13px;cursor:pointer;padding:2px 4px;border-radius:4px;transition:background .12s;}
.g-name:hover{background:var(--linen);color:var(--text);}
.g-name-input{flex:1;font-family:var(--font);font-size:13px;padding:2px 6px;border:1.5px solid var(--brown);border-radius:5px;background:#fff;color:var(--text);outline:none;min-width:0;}
.g-status{font-size:15px;cursor:pointer;border:none;background:none;padding:1px 3px;border-radius:4px;line-height:1;}
.g-status:hover{background:rgba(0,0,0,0.06);}
.cake-tog{width:26px;height:26px;border:1.5px solid var(--rule-md);border-radius:6px;background:var(--cream);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;opacity:0.3;}
.cake-tog:hover{background:var(--main-l);opacity:0.7;}
.cake-tog.on{background:#d6b777;border-color:#9a7010;box-shadow:0 0 0 2px #d6b77755;opacity:1;}
.g-rm{font-size:15px;line-height:1;color:var(--hint);border:none;background:none;cursor:pointer;padding:3px 5px;border-radius:4px;}
.g-rm:hover{color:#c0392b;background:#fdecea;}
.add-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.add-row input,.add-row select{font-family:var(--font);font-size:12px;padding:5px 8px;border:1px solid var(--rule-md);border-radius:7px;background:#fff;color:var(--text);height:30px;outline:none;}
.add-row input:focus,.add-row select:focus{border-color:var(--groom);}
.add-row input.gi{flex:1;min-width:70px;}
.add-row select{width:72px;}
.add-row .add-g-btn{font-family:var(--font);font-size:12px;padding:5px 10px;border:1px solid var(--brown);border-radius:7px;background:var(--brown);color:#fff;cursor:pointer;height:30px;}
.add-row .add-g-btn:hover{background:var(--groom-d);}
.cake-summary{font-size:11px;color:var(--main-d);margin-top:8px;padding:5px 9px;background:var(--main-l);border-radius:6px;font-weight:600;}
.no-cake-hint{font-size:11px;color:var(--hint);margin-top:6px;}

/* 寶寶椅計算器 */
.baby-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted);}
.baby-label{flex-shrink:0;}
.baby-count{font-weight:700;color:var(--text);min-width:18px;text-align:center;}
.baby-btn{font-family:var(--font);font-size:15px;line-height:1;width:24px;height:24px;border:1px solid var(--rule-md);border-radius:6px;background:var(--cream);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .1s;padding:0;}
.baby-btn:hover:not(:disabled){background:#f0e8d0;}
.baby-btn:disabled{opacity:0.3;cursor:default;background:transparent;}

.status-tally{font-size:11px;color:var(--muted);margin-top:6px;padding:4px 8px;background:rgba(0,0,0,0.03);border-radius:6px;}
.lp-order-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;margin-left:4px;}
.lp-order-btn{font-size:11px;line-height:1;border:1px solid var(--rule);background:var(--cream);color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:5px;font-family:var(--font);transition:background .1s;}
.lp-order-btn:hover{background:#f0e8d0;color:var(--text);}
.lp-order-btn:disabled{opacity:0.3;cursor:default;background:transparent;}
.lp-hdr-right{display:flex;align-items:flex-start;gap:6px;}

/* Canvas */
.canvas-wrap{position:relative;}
#venueCanvas{display:block;border-radius:var(--rl);border:1px solid var(--rule);cursor:default;}
#venueCanvas.dragging{cursor:grabbing;}
.canvas-hint{font-size:11px;color:var(--hint);text-align:center;padding:6px 0 0;}

@media print{
  .hdr-actions,.tabs,.add-tbar,.legend,.status-legend,.g-rm,.del-btn,.lp-del,.cake-tog,.add-row,.deco,.lp-order-btns,.baby-btn{display:none!important}
  body{background:#fff;}
  .main,.stats{padding:8px 0;}
}
</style>
</head>
<body>

<img class="deco deco-tl" src="https://ik.imagekit.io/itssaturday/other/Abby/1-1.svg" alt="">
<img class="deco deco-tr" src="https://ik.imagekit.io/itssaturday/other/Abby/1-2.svg" alt="">
<img class="deco deco-bl" src="https://ik.imagekit.io/itssaturday/other/Abby/1-3.svg" alt="">
<img class="deco deco-br" src="https://ik.imagekit.io/itssaturday/other/Abby/1-4.svg" alt="">

<div class="hdr">
  <img class="hdr-logo" src="https://ik.imagekit.io/itssaturday/other/Abby/LOGO.svg" alt="Abby &amp; Johnny" onerror="this.style.display='none'">
  <div>
    <div class="hdr-title">💍 <span>Abby &amp; Johnny</span> 婚宴桌位規劃表</div>

  </div>
  <div class="hdr-actions">
    <span id="syncStatus"></span>
    <button class="btn" onclick="window.print()">列印</button>
    <button class="btn sec" onclick="exportTxt()">匯出清單</button>
    <button class="btn cloud" onclick="saveToFirebase()">☁️ 儲存同步</button>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="leg"><div class="ld" style="background:#3a5991"></div>男方賓客</div>
  <div class="leg"><div class="ld" style="background:#c79483"></div>女方賓客</div>
  <div class="leg"><div class="ld" style="background:#88794e"></div>素食者</div>
  <div class="leg"><div class="ld empty"></div>空位</div>
  <div class="leg"><span style="font-size:13px">🎁</span>喜餅</div>
</div>
<div class="status-legend">
  出席狀態：<span>✅ 確認出席</span> <span>❓ 待確認</span> <span>🔄 還要再問</span>
  <span style="font-size:10px;color:var(--hint)">（清單視圖中點狀態圖示切換；點賓客姓名或桌名可編輯）</span>
</div>

<div class="tabs">
  <button class="tab active" id="tab-floor">🏛 會場視圖</button>
  <button class="tab" id="tab-list">📋 清單編輯</button>
</div>

<div class="main">
  <div class="add-tbar">
    <input class="tn" id="tn" type="text" placeholder="桌名（如：A桌）"/>
    <input class="ts" id="ts" type="number" value="10" min="2" max="24" title="座位數"/>
    <select id="tz">
      <option value="main">★ 主桌</option>
      <option value="groom">男方區</option>

  <div id="floor-view">
    <div class="canvas-wrap">
      <canvas id="venueCanvas"></canvas>
      <div class="canvas-hint">拖移圓桌可調整位置・右鍵刪除桌子</div>
    </div>
  </div>
  <div id="list-view" style="display:none"></div>
</div>

<div id="tooltip"></div>

<script>
// ── Firebase ──────────────────────────────────────────────────────────────────
var firebaseConfig = {
  apiKey: "AIzaSyDFuktxeJDNR1kJXK5L03Mrbv9K1S0Sgq0",
  authDomain: "abby-johnny-wedding.firebaseapp.com",
  projectId: "abby-johnny-wedding",
  storageBucket: "abby-johnny-wedding.firebasestorage.app",
  messagingSenderId: "983315441929",
  appId: "1:983315441929:web:ed3d249cc341dcc76acbd8"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
var isSyncing = false;

function showSync(msg, color) {
  var el = document.getElementById('syncStatus');
  if (el) { el.textContent = msg; el.style.color = color || '#639922'; }
}

function startRealtimeSync() {
  db.collection('seating').doc('tables').onSnapshot(function(doc) {
    if (doc.exists && doc.data() && doc.data().tables) {
      isSyncing = true;
      TABLES    = doc.data().tables;
      TABLE_POS = doc.data().positions || {};
      CANVAS_Z  = doc.data().canvasZ  || [];
      NID = doc.data().nid || (TABLES.reduce(function(m,t){ return Math.max(m,t.id); }, 0) + 1);
      render();
      showSync('已同步 ✓', '#639922');
      setTimeout(function(){ isSyncing = false; }, 600);
    }
  });
}

function saveToFirebase() {
  if (isSyncing) return;
  showSync('儲存中…', '#BA7517');
  db.collection('seating').doc('tables').set({
    tables:    TABLES,
    positions: TABLE_POS,
    canvasZ:   CANVAS_Z,
    nid:       NID,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){ showSync('已儲存 ✓', '#639922'); })
    .catch(function(e){ showSync('儲存失敗', '#c04020'); console.error(e); });
}

document.addEventListener('DOMContentLoaded', function() { startRealtimeSync(); });

// ── State ─────────────────────────────────────────────────────────────────────
var VIEW = 'floor';
var NID  = 10;
var ZL   = { main:'主桌', groom:'男方區', bride:'女方區' };
var ZC   = { main:'#E8A830', groom:'#3a5991', bride:'#E8A0B0' };
var STATUS_CYCLE = ['❓','✅','🔄'];
var TABLE_POS = {};
var CANVAS_Z  = [];

// label 保留 '' 以維持 Firestore 舊資料結構相容；新增 babyChairs 預設 0
var TABLES = [
  {id:1, name:'主桌', label:'', seats:12, zone:'main', babyChairs:0, guests:[
    {name:'張爸爸', side:'g', veg:false, cake:true,  status:'✅'},
    {name:'張媽媽', side:'g', veg:false, cake:false, status:'✅'},
    {name:'林爸爸', side:'b', veg:false, cake:true,  status:'✅'},
    {name:'林媽媽', side:'b', veg:true,  cake:false, status:'✅'},
    {name:'新郎',   side:'g', veg:false, cake:false, status:'✅'},
    {name:'新娘',   side:'b', veg:false, cake:false, status:'✅'},
  ]},
  {id:2, name:'男方親戚桌', label:'', seats:10, zone:'groom', babyChairs:0, guests:[
    {name:'張叔叔', side:'g', veg:false, cake:true,  status:'✅'},
    {name:'張阿姨', side:'g', veg:true,  cake:false, status:'❓'},
    {name:'張表哥', side:'g', veg:false, cake:false, status:'🔄'},
  ]},
  {id:3, name:'女方親戚桌', label:'', seats:10, zone:'bride', babyChairs:0, guests:[
    {name:'林舅舅', side:'b', veg:false, cake:true,  status:'✅'},
    {name:'林阿姨', side:'b', veg:true,  cake:false, status:'❓'},
  ]},
];

// ── CANVAS_Z helpers ──────────────────────────────────────────────────────────
function syncCanvasZ() {
  var existing = {};
  CANVAS_Z.forEach(function(id){ existing[id] = true; });
  TABLES.forEach(function(t){
    if (!existing[t.id]) { CANVAS_Z.push(t.id); existing[t.id] = true; }
  });
  CANVAS_Z = CANVAS_Z.filter(function(id){
    return TABLES.some(function(t){ return t.id === id; });
  });
}

function getTablesForCanvas() {
  syncCanvasZ();
  return CANVAS_Z.map(function(id){
    return TABLES.find(function(t){ return t.id === id; });
  }).filter(Boolean);
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
var TIP = document.getElementById('tooltip');
function showTip(e, text) { TIP.textContent = text; TIP.style.display = 'block'; moveTip(e); }
function moveTip(e) {
  var x = e.clientX + 14, y = e.clientY - 10;
  if (x + 150 > window.innerWidth) x = e.clientX - 160;
  TIP.style.left = x + 'px'; TIP.style.top = y + 'px';
}
function hideTip() { TIP.style.display = 'none'; }
document.addEventListener('mouseover',  function(e){ if (e.target.dataset.tip) showTip(e, e.target.dataset.tip); });
document.addEventListener('mousemove',  function(e){ if (TIP.style.display === 'block') moveTip(e); });
document.addEventListener('mouseout',   function(e){ if (e.target.dataset.tip) hideTip(); });

// ── Event delegation ──────────────────────────────────────────────────────────
document.addEventListener('click', function(e) {
  var el = e.target;
  // 行內編輯 input 由 blur 自行處理，click 不攔截
  if (el.classList.contains('g-name-input'))  return;
  if (el.classList.contains('lp-name-input')) return;

  for (var i = 0; i < 6; i++) {
    if (!el || el === document.body) break;
    var a = el.dataset.action;
    if (a === 'del-table')       { doDelTable(+el.dataset.id); return; }
    if (a === 'del-guest')       { doDelGuest(+el.dataset.id, +el.dataset.idx); return; }
    if (a === 'toggle-cake')     { doToggleCake(+el.dataset.id, +el.dataset.idx); return; }
    if (a === 'toggle-status')   { doToggleStatus(+el.dataset.id, +el.dataset.idx); return; }
    if (a === 'add-guest')       { addGuest(+el.dataset.id); return; }
    if (a === 'table-up')        { doMoveTable(+el.dataset.id, -1); return; }
    if (a === 'table-down')      { doMoveTable(+el.dataset.id,  1); return; }
    if (a === 'edit-guest-name') { startEditGuestName(+el.dataset.id, +el.dataset.idx); return; }
    if (a === 'edit-table-name') { startEditTableName(+el.dataset.id); return; }
    if (a === 'baby-inc')        { doBabyChair(+el.dataset.id,  1); return; }
    if (a === 'baby-dec')        { doBabyChair(+el.dataset.id, -1); return; }
    if (a === 'focus-add') {
      document.getElementById('tz').value = el.dataset.zone;
      document.getElementById('tn').focus();
      return;
    }
    el = el.parentElement;
  }
  if (e.target.id === 'add-table-btn') { addTable(); return; }
  if (e.target.id === 'tab-floor')     { setView('floor'); return; }
  if (e.target.id === 'tab-list')      { setView('list');  return; }
});

// ── 中文輸入法 & 鍵盤 ─────────────────────────────────────────────────────────
var isComposing = false;
document.addEventListener('compositionstart', function() { isComposing = true; });
document.addEventListener('compositionend',   function() { isComposing = false; });

document.addEventListener('keydown', function(e) {
  if (isComposing) return;
  if (e.key === 'Enter') {
    // 新增賓客輸入框
    if (e.target.dataset.action === 'guest-input') { addGuest(+e.target.dataset.id); return; }
    // 新增桌子輸入框
    if (e.target.id === 'tn') { addTable(); return; }
    // 賓客姓名 / 桌名 行內編輯框
    if (e.target.classList.contains('g-name-input') ||
        e.target.classList.contains('lp-name-input')) {
      e.target.blur(); return;
    }
  }
  // Escape 取消行內編輯
  if (e.key === 'Escape') {
    if (e.target.classList.contains('g-name-input') ||
        e.target.classList.contains('lp-name-input')) {
      e.target.dataset.cancelled = '1';
      e.target.blur(); return;
    }
  }
});

// ── 賓客姓名行內編輯 ──────────────────────────────────────────────────────────
function startEditGuestName(tid, idx) {
  var span = document.querySelector(
    '.g-name[data-action="edit-guest-name"][data-id="'+tid+'"][data-idx="'+idx+'"]'
  );
  if (!span) return;
  var t = TABLES.find(function(t){ return t.id === tid; });
  if (!t || !t.guests[idx]) return;
  var originalName = t.guests[idx].name;

  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'g-name-input';
  input.value = originalName;
  input.dataset.cancelled = '';
  span.parentNode.replaceChild(input, span);
  input.focus(); input.select();

  input.addEventListener('blur', function() {
    if (input.dataset.cancelled === '1') { renderList(); return; }
    var newName = input.value.trim();
    if (!newName) { renderList(); return; }
    if (newName !== originalName) { t.guests[idx].name = newName; saveToFirebase(); }
    renderList(); renderStats();
  });
}

// ── 桌名行內編輯 ──────────────────────────────────────────────────────────────
function startEditTableName(tid) {
  var span = document.querySelector(
    '.lp-name[data-action="edit-table-name"][data-id="'+tid+'"]'
  );
  if (!span) return;
  var t = TABLES.find(function(t){ return t.id === tid; });
  if (!t) return;
  var originalName = t.name;

  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'lp-name-input';
  input.value = originalName;
  input.dataset.cancelled = '';
  span.parentNode.replaceChild(input, span);
  input.focus(); input.select();

  input.addEventListener('blur', function() {
    if (input.dataset.cancelled === '1') { renderList(); return; }
    var newName = input.value.trim();
    if (!newName) { renderList(); return; }
    if (newName !== originalName) { t.name = newName; saveToFirebase(); }
    renderList(); renderStats();
  });
}

// ── Data actions ──────────────────────────────────────────────────────────────
function doDelTable(id) {
  if (!confirm('確定刪除這張桌子？')) return;
  TABLES = TABLES.filter(function(t){ return t.id !== id; });
  delete TABLE_POS[id];
  syncCanvasZ();
  render(); saveToFirebase();
}
function doDelGuest(id, idx) {
  var t = TABLES.find(function(t){ return t.id === id; });
  if (t) { t.guests.splice(idx, 1); render(); saveToFirebase(); }
}
function doToggleCake(id, idx) {
  var t = TABLES.find(function(t){ return t.id === id; });
  if (t) { t.guests[idx].cake = !t.guests[idx].cake; render(); saveToFirebase(); }
}
function doToggleStatus(id, idx) {
  var t = TABLES.find(function(t){ return t.id === id; });
  if (!t) return;
  var cur  = t.guests[idx].status || '❓';
  var next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur) + 1) % STATUS_CYCLE.length];
  t.guests[idx].status = next;
  render(); saveToFirebase();
}
function doBabyChair(id, delta) {
  var t = TABLES.find(function(t){ return t.id === id; });
  if (!t) return;
  t.babyChairs = Math.max(0, (t.babyChairs || 0) + delta);
  render(); saveToFirebase();
}
function doMoveTable(id, dir) {
  var t = TABLES.find(function(t){ return t.id === id; });
  if (!t) return;
  var zone = t.zone;
  var zoneIndices = [];
  TABLES.forEach(function(tbl, i){ if (tbl.zone === zone) zoneIndices.push(i); });
  var posInZone    = zoneIndices.findIndex(function(i){ return TABLES[i].id === id; });
  var targetInZone = posInZone + dir;
  if (targetInZone < 0 || targetInZone >= zoneIndices.length) return;
  var idxA = zoneIndices[posInZone], idxB = zoneIndices[targetInZone];
  var tmp = TABLES[idxA]; TABLES[idxA] = TABLES[idxB]; TABLES[idxB] = tmp;
  render(); saveToFirebase();
}

function addTable() {
  var name  = document.getElementById('tn').value.trim();
  var seats = parseInt(document.getElementById('ts').value) || 10;
  var zone  = document.getElementById('tz').value;
  if (!name) { document.getElementById('tn').focus(); return; }
  var newId = NID++;
  TABLES.push({id:newId, name:name, label:'', seats:seats, zone:zone, babyChairs:0, guests:[]});
  CANVAS_Z.push(newId);
  document.getElementById('tn').value = '';
  render(); saveToFirebase();
}

function addGuest(tid) {
  var n = document.getElementById('gin_'+tid);
  var s = document.getElementById('gis_'+tid);
  var v = document.getElementById('giv_'+tid);
  if (!n) return;
  var name = n.value.trim();
  if (!name) { n.focus(); return; }
  var t = TABLES.find(function(t){ return t.id === tid; });
  if (!t) return;
  if (t.guests.length >= t.seats) { alert('座位已滿！'); return; }
  t.guests.push({name:name, side:s.value, veg:v.value==='1', cake:false, status:'❓'});
  n.value = ''; n.focus();
  render(); saveToFirebase();
}

function setView(v) {
  VIEW = v;
  document.getElementById('floor-view').style.display = v==='floor'?'block':'none';
  document.getElementById('list-view').style.display  = v==='list' ?'block':'none';
  document.getElementById('tab-floor').className = 'tab'+(v==='floor'?' active':'');
  document.getElementById('tab-list').className  = 'tab'+(v==='list' ?' active':'');
  render();
}

// ── SVG round table ───────────────────────────────────────────────────────────
function drawSVG(t, sz) {
  sz = sz || 140;
  var cx = sz/2, cy = sz/2, tR = sz*0.27, sR = sz*0.076;
  var zc = ZC[t.zone] || '#888';
  var nodes = [];
  for (var i = 0; i < t.seats; i++) {
    var ang  = (i/t.seats)*2*Math.PI - Math.PI/2;
    var dist = tR + sR + 4;
    var x    = (cx + dist*Math.cos(ang)).toFixed(1);
    var y    = (cy + dist*Math.sin(ang)).toFixed(1);
    var g    = t.guests[i];
    if (!g) {
      nodes.push('<circle cx="'+x+'" cy="'+y+'" r="'+sR.toFixed(1)+'" fill="#e8e6e0" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" data-tip="空位"/>');
    } else {
      var fill, stroke;
      if (g.veg)             { fill='#C8D870'; stroke='#4A6010'; }
      else if (g.side==='g') { fill='#A0B8D8'; stroke='#2A4880'; }
      else                   { fill='#D8A0B0'; stroke='#802848'; }
      var tip = g.name+' '+(g.status||'❓')+(g.veg?' 素食':'')+(g.cake?' 🎁':'');
      nodes.push('<circle cx="'+x+'" cy="'+y+'" r="'+sR.toFixed(1)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5" data-tip="'+tip+'"/>');
      var nc = g.veg?'#4A5810':(g.side==='g'?'#A03010':'#8A2840');
      nodes.push('<text x="'+x+'" y="'+(parseFloat(y)+sR*0.42).toFixed(1)+'" text-anchor="middle" font-size="'+(sR*0.78).toFixed(0)+'" fill="'+nc+'" font-weight="'+(g.veg?'700':'400')+'" pointer-events="none">'+g.name.slice(0,1)+'</text>');
      if (g.cake) nodes.push('<text x="'+(parseFloat(x)+sR*0.65).toFixed(1)+'" y="'+(parseFloat(y)-sR*0.5).toFixed(1)+'" text-anchor="middle" font-size="'+(sR*0.75).toFixed(0)+'" pointer-events="none">🎁</text>');
    }
  }
  var cakes = t.guests.filter(function(g){ return g.cake; }).length;
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;display:block;">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+tR+'" fill="'+zc+'22" stroke="'+zc+'" stroke-width="2"/>'
    +'<text x="'+cx+'" y="'+(cy-7).toFixed(0)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+zc+'">'+t.name+'</text>'
    +'<text x="'+cx+'" y="'+(cy+8).toFixed(0)+'" text-anchor="middle" font-size="9" fill="'+zc+'">'+t.guests.length+'/'+t.seats+'人</text>'
    +(cakes?'<text x="'+cx+'" y="'+(cy+20).toFixed(0)+'" text-anchor="middle" font-size="8.5" fill="'+ZC.main+'">🎁×'+cakes+'</text>':'')
    +nodes.join('')+'</svg>';
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  var tg = TABLES.reduce(function(a,t){ return a+t.guests.length; },0);
  var gm = TABLES.reduce(function(a,t){ return a+t.guests.filter(function(g){ return g.side==='g'; }).length; },0);
  var br = TABLES.reduce(function(a,t){ return a+t.guests.filter(function(g){ return g.side==='b'; }).length; },0);
  var vg = TABLES.reduce(function(a,t){ return a+t.guests.filter(function(g){ return g.veg; }).length; },0);
  var ck = TABLES.reduce(function(a,t){ return a+t.guests.filter(function(g){ return g.cake; }).length; },0);
  var cf = TABLES.reduce(function(a,t){ return a+t.guests.filter(function(g){ return g.status==='✅'; }).length; },0);
  var em = TABLES.reduce(function(a,t){ return a+(t.seats-t.guests.length); },0);
  var bc = TABLES.reduce(function(a,t){ return a+(t.babyChairs||0); },0);

  document.getElementById('stats').innerHTML =
    sc('桌數',TABLES.length,'')+
    sc('總賓客',tg,'')+
    sc('男方',gm,'var(--groom-d)')+
    sc('女方',br,'var(--bride-d)')+
    sc('素食',vg,'var(--veg-d)')+
    sc('喜餅',ck,'var(--main-d)')+
    sc('已確認',cf,'#2a8a2a')+
    sc('空位',em,'var(--muted)')+

function sc(l,v,c){ return '<div class="sc"><div class="sc-l">'+l+'</div><div class="sc-v"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div></div>'; }

// ── Canvas Floor View ─────────────────────────────────────────────────────────
var canvas, ctx;
var CANVAS_W = 1100, CANVAS_H = 820;
var dragId = null, dragOffX = 0, dragOffY = 0;
var TABLE_R = 38;

function getPos(t) {
  if (TABLE_POS[t.id]) return TABLE_POS[t.id];
  var zTables = TABLES.filter(function(x){ return x.zone === t.zone; });
  var idx = zTables.indexOf(t);
  if (t.zone === 'main') {
    return { x: CANVAS_W/2 - (zTables.length-1)*110/2 + idx*110, y: 90 };
  } else if (t.zone === 'groom') {
    var col = idx%4, row = Math.floor(idx/4);
    return { x: 60+col*110, y: 210+row*130 };
  } else {
    var col = idx%4, row = Math.floor(idx/4);
    return { x: CANVAS_W-60-(3-col)*110, y: 210+row*130 };
  }
}

function initCanvas() {
  canvas = document.getElementById('venueCanvas');
  if (!canvas) return;
  var dpr = Math.min(window.devicePixelRatio||1, 3);
  canvas.width  = CANVAS_W * dpr;
  canvas.height = CANVAS_H * dpr;
  canvas.style.width  = '100%';
  canvas.style.height = 'auto';
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  canvas.addEventListener('mousedown',   onMouseDown);
  canvas.addEventListener('mousemove',   onMouseMove);
  canvas.addEventListener('mouseup',     onMouseUp);
  canvas.addEventListener('mouseleave',  onMouseUp);
  canvas.addEventListener('contextmenu', onRightClick);
}

function canvasXY(e) {
  var rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (CANVAS_W / rect.width),
    y: (e.clientY - rect.top)  * (CANVAS_H / rect.height)
  };
}

function hitTest(mx, my) {
  syncCanvasZ();
  for (var i = CANVAS_Z.length-1; i >= 0; i--) {
    var id = CANVAS_Z[i];
    var t  = TABLES.find(function(t){ return t.id === id; });
    if (!t) continue;
    var p  = TABLE_POS[t.id] || getPos(t);
    var dx = mx-p.x, dy = my-p.y;
    if (dx*dx + dy*dy <= TABLE_R*TABLE_R) return t;
  }
  return null;
}

function onMouseDown(e) {
  var p = canvasXY(e), t = hitTest(p.x, p.y);
  if (t) {
    dragId = t.id;
    var pos = TABLE_POS[t.id] || getPos(t);
    dragOffX = p.x - pos.x; dragOffY = p.y - pos.y;
    canvas.classList.add('dragging');
    var cidx = CANVAS_Z.indexOf(t.id);
    if (cidx !== -1) { CANVAS_Z.splice(cidx,1); CANVAS_Z.push(t.id); }
  }
}
function onMouseMove(e) {
  var p = canvasXY(e);
  if (dragId !== null) {
    var nx = Math.max(TABLE_R, Math.min(CANVAS_W-TABLE_R, p.x-dragOffX));
    var ny = Math.max(TABLE_R, Math.min(CANVAS_H-TABLE_R, p.y-dragOffY));
    TABLE_POS[dragId] = {x:nx, y:ny};
    drawCanvas();
  } else {
    canvas.style.cursor = hitTest(p.x, p.y) ? 'grab' : 'default';
  }
}
function onMouseUp() {
  if (dragId !== null) { canvas.classList.remove('dragging'); dragId = null; saveToFirebase(); }
}
function onRightClick(e) {
  e.preventDefault();
  var p = canvasXY(e), t = hitTest(p.x, p.y);
  if (t && confirm('刪除「'+t.name+'」桌？')) doDelTable(t.id);
}

function drawCanvas() {
  if (!ctx) return;
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  ctx.fillStyle = '#fdfaf5'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  // Stage
  ctx.fillStyle = '#f5ecd8'; ctx.fillRect(0, 0, CANVAS_W, 44);
  ctx.strokeStyle = '#d6b777'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,44); ctx.lineTo(CANVAS_W,44); ctx.stroke();
  ctx.fillStyle = '#88794e';
  ctx.font = '500 12px Chiron GoRound TC,Noto Sans TC,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('✦  舞台 / 主持區  ✦', CANVAS_W/2, 27);
  // Centre divider
  ctx.strokeStyle = '#ddd5cc'; ctx.lineWidth = 1; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(CANVAS_W/2,44); ctx.lineTo(CANVAS_W/2,CANVAS_H); ctx.stroke();
  ctx.setLineDash([]);
  // Zone labels
  ctx.font = '11px Chiron GoRound TC,Noto Sans TC,sans-serif'; ctx.fillStyle = '#9a8878';
  ctx.textAlign = 'left';  ctx.fillText('◀ 男方賓客區', 14, CANVAS_H-12);
  ctx.textAlign = 'right'; ctx.fillText('女方賓客區 ▶', CANVAS_W-14, CANVAS_H-12);
  // Render tables in z-order
  getTablesForCanvas().forEach(function(t) {
    var p = TABLE_POS[t.id] || getPos(t);
    if (!TABLE_POS[t.id]) TABLE_POS[t.id] = {x:p.x, y:p.y};
    drawTable(t, p.x, p.y);
  });
}

function drawTable(t, cx, cy) {
  var ZF  = { main:'#ede0a8', groom:'#dce5f5', bride:'#ecddd8' };
  var ZTX = { main:'#7a5a18', groom:'#1e3560', bride:'#7a4838' };
  var zf  = ZF[t.zone]  || '#e0d8cc';
  var ztx = ZTX[t.zone] || '#4a3020';
  var R = TABLE_R, sR = R*0.26, dist = R+sR+5;

  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.fillStyle = zf; ctx.fill();

  ctx.fillStyle = ztx;
  ctx.font = 'bold 11px Chiron GoRound TC,Noto Sans TC,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t.name, cx, cy-4);
  ctx.fillStyle = ztx+'aa';
  ctx.font = '9px Chiron GoRound TC,Noto Sans TC,sans-serif';
  ctx.fillText(t.guests.length+'/'+t.seats+' 人', cx, cy+8);
  ctx.textBaseline = 'alphabetic';

  var GC = { groom:'#3a5991', bride:'#c79483', veg:'#88794e' };
  t.guests.forEach(function(g, i) {
    var ang = (i/t.seats)*Math.PI*2 - Math.PI/2;
    var sx  = cx+dist*Math.cos(ang), sy = cy+dist*Math.sin(ang);
    var fill = g.veg ? GC.veg : (g.side==='g' ? GC.groom : GC.bride);
    ctx.beginPath(); ctx.arc(sx, sy, sR, 0, Math.PI*2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.fillStyle = '#fffffd';
    ctx.font = 'bold '+Math.round(sR*0.88)+'px Chiron GoRound TC,Noto Sans TC,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(g.name.slice(0,1), sx, sy+0.5);
    ctx.textBaseline = 'alphabetic';
  });
  for (var i = t.guests.length; i < t.seats; i++) {
    var ang = (i/t.seats)*Math.PI*2 - Math.PI/2;
    var sx  = cx+dist*Math.cos(ang), sy = cy+dist*Math.sin(ang);
    ctx.beginPath(); ctx.arc(sx, sy, sR, 0, Math.PI*2);
    ctx.fillStyle = '#ede8e0'; ctx.fill();
    ctx.setLineDash([3,2]); ctx.strokeStyle = '#c8c0b8'; ctx.lineWidth = 1;
    ctx.stroke(); ctx.setLineDash([]);
  }
}

function renderFloor() {
  if (!canvas) initCanvas();
  if (!ctx) initCanvas();
  if (!canvas) return;
  drawCanvas();
}

// ── List view ─────────────────────────────────────────────────────────────────

          +' <span class="badge '+(t.zone==='groom'?'g':t.zone==='bride'?'b':'m')+'" style="font-size:9px">'+ZL[t.zone]+'</span>'
        +'</span>'
        +'<div class="lp-sub">'+t.guests.length+'/'+t.seats+' 人</div>'
      +'</div>'
      +'<div class="lp-hdr-right">'
        +'<div class="lp-order-btns">'
          +'<button class="lp-order-btn" data-action="table-up"   data-id="'+t.id+'" title="上移" '+(isFirst?'disabled':'')+'>🔼</button>'
          +'<button class="lp-order-btn" data-action="table-down" data-id="'+t.id+'" title="下移" '+(isLast ?'disabled':'')+'>🔽</button>'
        +'</div>'
        +'<button class="lp-del" data-action="del-table" data-id="'+t.id+'">刪除桌子</button>'
      +'</div>'
    +'</div>'
    // ── 寶寶椅計算器 ──
    +'<div class="baby-row">'
      +'<span class="baby-label">👶 寶寶椅：</span>'
      +'<button class="baby-btn" data-action="baby-dec" data-id="'+t.id+'" '+(baby<=0?'disabled':'')+' title="減少">−</button>'
      +'<span class="baby-count">'+baby+'</span>'
      +'<button class="baby-btn" data-action="baby-inc" data-id="'+t.id+'" title="增加">＋</button>'
    +'</div>'
    // ── 賓客列表 ──
    +'<div class="g-rows">'+(rows||'<div style="font-size:12px;color:var(--hint);padding:6px 0">尚無賓客</div>')+'</div>'
    +'<div class="status-tally">✅'+conf+' ❓'+pend+' 🔄'+reask+'</div>'
    +(cakes.length
      ?'<div class="cake-summary">🎁 喜餅 '+cakes.length+' 份・'+cakes.map(function(g){ return g.name; }).join('、')+'</div>'
      :'<div class="no-cake-hint">點 🎁 指定哪位賓客領喜餅</div>')
    +'<div class="add-row">'
      +'<input class="gi" id="gin_'+t.id+'" type="text" placeholder="賓客姓名" data-action="guest-input" data-id="'+t.id+'"/>'
      +'<select id="gis_'+t.id+'"><option value="g"'+(t.zone==='bride'?'':' selected')+'>男方</option><option value="b"'+(t.zone==='bride'?' selected':'')+'>女方</option></select>'
      +'<select id="giv_'+t.id+'"><option value="0">葷食</option><option value="1">素食</option></select>'
      +'<button class="add-g-btn" data-action="add-guest" data-id="'+t.id+'">+ 加入</button>'
    +'</div>'
  +'</div>';
}

function renderList() {
  var el     = document.getElementById('list-view');
  var mainT  = TABLES.filter(function(t){ return t.zone==='main'; });
  var groomT = TABLES.filter(function(t){ return t.zone==='groom'; });
  var brideT = TABLES.filter(function(t){ return t.zone==='bride'; });
  var html   = '';

  if (mainT.length) {
    html += '<div class="list-top-area">'
      +'<div class="list-col-hdr m" style="margin-bottom:10px">★ 主桌區</div>'
      +'<div class="lpanel-grid">'+mainT.map(function(t){ return lpanel(t,mainT); }).join('')+'</div>'
      +'</div>';
  }
  html += '<div class="list-cols">'
    +'<div class="list-col"><div class="list-col-hdr g">◀ 男方賓客區</div>'
    +'<div class="lpanel-grid">'
    +(groomT.length ? groomT.map(function(t){ return lpanel(t,groomT); }).join('') : '<div class="empty-zone" data-action="focus-add" data-zone="groom" style="grid-column:1/-1">+ 新增男方桌子</div>')
    +'</div></div>'
    +'<div class="list-col"><div class="list-col-hdr b">女方賓客區 ▶</div>'
    +'<div class="lpanel-grid">'
    +(brideT.length ? brideT.map(function(t){ return lpanel(t,brideT); }).join('') : '<div class="empty-zone" data-action="focus-add" data-zone="bride" style="grid-column:1/-1">+ 新增女方桌子</div>')
    +'</div></div>'
    +'</div>';

  el.innerHTML = html;
}

function render() {
  renderStats();
  if (VIEW==='floor') renderFloor();
  else renderList();
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportTxt() {
  var tg = TABLES.reduce(function(a,t){ return a+t.guests.length; },0);
  var vg = TABLES.reduce(function(a,t){ return a+t.guests.filter(function(g){ return g.veg; }).length; },0);
  var ck = TABLES.reduce(function(a,t){ return a+t.guests.filter(function(g){ return g.cake; }).length; },0);
  var cf = TABLES.reduce(function(a,t){ return a+t.guests.filter(function(g){ return g.status==='✅'; }).length; },0);
  var bc = TABLES.reduce(function(a,t){ return a+(t.babyChairs||0); },0);
  var txt = 'Abby & Johnny 婚宴桌位規劃表\n'+'='.repeat(36)+'\n';
  txt += '總桌數：'+TABLES.length+'　總賓客：'+tg+'　確認：'+cf+'人　素食：'+vg+'人　喜餅：'+ck+'份　👶寶寶椅：'+bc+'張\n\n';
  TABLES.forEach(function(t){
    var cakes = t.guests.filter(function(g){ return g.cake; });
    var veg   = t.guests.filter(function(g){ return g.veg; }).length;
    var baby  = t.babyChairs || 0;
    txt += '【'+t.name+'】'+ZL[t.zone]+'　'+t.guests.length+'/'+t.seats+'人'+(baby?'　👶寶寶椅 '+baby+'張':'')+'\n';
    txt += '  喜餅 '+cakes.length+'份';
    if (cakes.length) txt += '，由 '+cakes.map(function(g){ return g.name; }).join('、')+' 領取';
    if (veg) txt += '　素食 '+veg+'人';
    txt += '\n';
    t.guests.forEach(function(g){
      txt += '  '+(g.status||'❓')+' '+g.name+'（'+(g.side==='g'?'男方':'女方')+(g.veg?' ★素食':'')+(g.cake?' 🎁':'')+'）\n';
    });
    txt += '\n';
  });
  var blob = new Blob([txt],{type:'text/plain;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'Abby_Johnny_婚宴桌位規劃.txt'; a.click();
}

render();
</script>
</body>
</html>
